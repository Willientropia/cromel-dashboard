appId: com.cromel.dashboard
productName: Cromel Dashboard
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - firebase-service-account.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,mjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierrc.yaml}'
  - '!{.env,.env.*,.npmrc}'
win:
  executableName: cromel-dashboard
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.svg
  target:
    - AppImage
    - deb
  category: Utility
npmRebuild: false
publish:
  provider: github
  owner: Willientropia
  repo: cromel-dashboard
  private: true
